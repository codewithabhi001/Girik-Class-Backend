  /api/v1/certificates:
    get:
      tags:
        - Certificates
      summary: 'List certificates'
      description: "List certificates with strict RBAC and ownership filtering.\nUse `expiring_within_days` to filter certificates expiring soon (defaults to VALID when status omitted).\n`status_counts` returns every certificate status with count 0 where none match (same filters as list except `status`).\n**Access:**\n- **ADMIN / GM / TM / TO:** All certificates.\n- **CLIENT:** Only certificates for their own company vessels.\n"
      security:
        -
          bearerAuth: []
      operationId: getCertificates
      x-roles:
        - CLIENT
        - ADMIN
        - GM
        - TM
        - TO
      parameters:
        -
          name: page
          in: query
          schema:
            type: integer
            default: 1
        -
          name: limit
          in: query
          schema:
            type: integer
            default: 20
        -
          name: vessel_id
          in: query
          schema:
            type: string
            format: uuid
        -
          name: certificate_type_id
          in: query
          schema:
            type: string
            format: uuid
        -
          name: status
          in: query
          schema:
            type: string
            enum:
              - DRAFT
              - ISSUED
              - VALID
              - EXPIRED
              - SUSPENDED
              - REVOKED
              - TRANSFERRED
              - DOWNGRADED
        -
          name: client_id
          in: query
          schema:
            type: string
            format: uuid
        -
          name: expiring_within_days
          in: query
          description: 'Return VALID certificates expiring within N days (default 30 when used).'
          schema:
            type: integer
            minimum: 1
            example: 30
      responses:
        '200':
          description: 'List of certificates'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean, example: true}
                  data: {type: object, properties: {total: {type: integer, example: 100}, page: {type: integer, example: 1}, limit: {type: integer, example: 20}, totalPages: {type: integer, example: 5}, status_counts: {type: array, items: {$ref: '#/components/schemas/StatusCount'}}, rows: {type: array, items: {$ref: '#/components/schemas/CertificateSummary'}}}}
              example:
                success: true
                data:
                  total: 100
                  page: 1
                  limit: 20
                  totalPages: 5
                  status_counts: [{status: CREATED, count: 5}]
                  rows: [{id: 01933c5e-7f2a-7a00-8000-1a2b3c4d5e6f, vessel_id: string, certificate_type_id: string, certificate_number: string, issue_date: '2026-03-15', expiry_date: '2026-03-15', status: DRAFT, created_at: '2026-03-15T10:00:00.000Z', Vessel: {id: string, vessel_name: string, imo_number: string}, CertificateType: {id: string, name: string}}]
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error_code: VALIDATION_ERROR
                message: 'Validation failed. Please correct the highlighted fields.'
                errors:
                  vessel_id: 'vessel_id is required'
                trace_id: 01933c5e-7f2a-7a00-8000-1a2b3c4d5e6f
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error_code: VALIDATION_ERROR
                message: 'Validation failed. Please correct the highlighted fields.'
                errors:
                  vessel_id: 'vessel_id is required'
                trace_id: 01933c5e-7f2a-7a00-8000-1a2b3c4d5e6f
    post:
      tags:
        - Certificates
      summary: 'Generate draft certificate (GM/TM)'
      description: "Generates a new draft certificate for a completed survey.\n\n**Workflow Logic:**\n- The associated certificate survey must be `FINALIZED`.\n- **Multi-certificate Jobs**: You **must** provide `job_certificate_id` in the request body to identify which certificate to generate. Otherwise, the request will fail with a `400` status.\n- **Single-certificate Jobs**: If `job_certificate_id` is omitted, it will automatically fall back to the sole certificate associated with the job.\n- Transitions the targeted `JobCertificate` to have a `DRAFT` certificate.\n\n**Roles:** GM, TM\n"
      security:
        -
          bearerAuth: []
      operationId: generateCertificate
      x-roles:
        - GM
        - TM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateCertificateRequest'
            example:
              job_id: 01933c5e-7f2a-7a00-8000-1a2b3c4d5e6f
