# ─────────────────────────────────────────────────────────────────────────────
# CHECKLISTS
#
# All SURVEYOR read/write operations are scoped to:
#   /api/v1/checklists/job-certificates/{jobCertificateId}
#
# TO/ADMIN review operations remain job-scoped (item & signed-file reviews):
#   /api/v1/checklists/jobs/{jobId}/items/{itemId}/review
#   /api/v1/checklists/jobs/{jobId}/signed-files/{fileIndex}/review
#
# Role summary:
#   SURVEYOR — read checklist, save answers, upload evidence, update signed docs
#   TO/ADMIN — review individual items and signed docs
#   GM, TM    — read checklist (ADMIN role check on GET route)
# ─────────────────────────────────────────────────────────────────────────────

/api/v1/checklists/job-certificates/{jobCertificateId}:
  get:
    tags:
      - Checklists
    summary: Get checklist for a job certificate
    description: |
      Returns checklist items, signed-checklist scan URLs, and survey details
      for a **specific JobCertificate**. Each certificate in a multi-cert job
      has its own independent checklist.

      All `file_url` fields and `signed_checklist_files` entries are guaranteed
      to be either fully-qualified HTTPS URLs or `null` — raw S3 keys are never
      returned to the client.
    operationId: getChecklist
    security:
      - bearerAuth: []
    x-roles: [ADMIN, GM, TM, TO, SURVEYOR]
    parameters:
      - in: path
        name: jobCertificateId
        schema:
          type: string
          format: uuid
        required: true
        description: Unique identifier of the JobCertificate
      - in: query
        name: answer
        schema:
          type: string
          enum: [YES, NO, NA]
        description: Filter by answer status
      - in: query
        name: question_code
        schema:
          type: string
        description: Filter by specific question code
      - in: query
        name: search
        schema:
          type: string
        description: Search in question text or remarks
    responses:
      '200':
        description: Checklist retrieved successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecklistResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '404':
        description: JobCertificate not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

  put:
    tags:
      - Checklists
    summary: Save checklist answers (+ optional signed-scan files)
    description: |
      Submit or replace checklist answers for a specific `JobCertificate`.
      In the same call the surveyor can attach the S3 keys of the full
      signed-checklist scan document(s) — obtained earlier from
      `GET /checklists/job-certificates/{jobCertificateId}/signed-checklist-upload-url`.

      Re-submission is allowed until the survey is finalized. Only the
      assigned `SURVEYOR` can perform this action while the survey is in an
      active state (`STARTED`, `CHECKLIST_SUBMITTED`, `PROOF_UPLOADED`,
      or `REWORK_REQUIRED`).
    operationId: submitChecklist
    security:
      - bearerAuth: []
    x-roles: [SURVEYOR]
    parameters:
      - in: path
        name: jobCertificateId
        schema:
          type: string
          format: uuid
        required: true
        description: Unique identifier of the JobCertificate
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChecklistSubmission'
          example:
            items:
              - question_code: "LSE001"
                question_text: "Are life jackets available?"
                answer: "YES"
                remarks: "Verified count matches record"
                file_url: ""
              - question_code: "LSE002"
                question_text: "Is the fire extinguisher charged?"
                answer: "NO"
                remarks: "Pressure low, needs replacement"
                file_url: "surveys/checklist-evidence/<jobCertificateId>/1714000000000_fire_ext.jpg"
            signed_checklist_files:
              - "surveys/signed-checklists/<jobCertificateId>/1714000000000_signed.pdf"
    responses:
      '200':
        description: Checklist submitted successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecklistResponse'
      '400':
        description: Bad Request (invalid state, terminal job, etc.)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: Forbidden — caller is not the assigned surveyor
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '404':
        description: JobCertificate not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

/api/v1/checklists/job-certificates/{jobCertificateId}/get-upload-url:
  get:
    tags:
      - Checklists
    summary: Get upload URL for a single checklist-item evidence photo
    description: |
      Generates a pre-signed S3 URL so the surveyor can directly upload one
      photo of evidence for a **single** checklist item (e.g. a failing item)
      for this certificate's survey. The returned `fileKey` is then passed back
      as `file_url` on that item in the next
      `PUT /checklists/job-certificates/{jobCertificateId}` call.
    operationId: getChecklistItemUploadUrl
    security:
      - bearerAuth: []
    x-roles: [SURVEYOR]
    parameters:
      - in: path
        name: jobCertificateId
        schema:
          type: string
          format: uuid
        required: true
        description: Unique identifier of the JobCertificate
      - in: query
        name: fileName
        schema:
          type: string
        required: true
        description: The filename with extension (e.g. proof.jpg)
      - in: query
        name: contentType
        schema:
          type: string
        required: true
        description: The MIME type of the file (e.g. image/jpeg)
    responses:
      '200':
        description: Upload URL generated successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlResponse'
      '400':
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: Forbidden — caller is not the assigned surveyor
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '404':
        description: JobCertificate not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

/api/v1/checklists/job-certificates/{jobCertificateId}/signed-checklist-upload-url:
  get:
    tags:
      - Checklists
    summary: Get upload URL for the full signed-checklist scan
    description: |
      Generates a pre-signed S3 URL so the surveyor can upload the full
      filled & signed checklist document (PDF / image) for this certificate's
      survey — one or more files representing the actual signed sheet.

      After uploading directly to S3 with the returned `uploadUrl`, send the
      `fileKey` back inside the `signed_checklist_files` array on the next
      `PUT /checklists/job-certificates/{jobCertificateId}` call.
    operationId: getSignedChecklistUploadUrl
    security:
      - bearerAuth: []
    x-roles: [SURVEYOR]
    parameters:
      - in: path
        name: jobCertificateId
        schema:
          type: string
          format: uuid
        required: true
        description: Unique identifier of the JobCertificate
      - in: query
        name: fileName
        schema:
          type: string
        required: true
        description: The filename with extension (e.g. signed_checklist.pdf)
      - in: query
        name: contentType
        schema:
          type: string
        required: true
        description: The MIME type of the file (e.g. application/pdf)
    responses:
      '200':
        description: Upload URL generated successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlResponse'
      '400':
        description: Bad Request (job not survey-eligible / terminal state)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: Forbidden — caller is not the assigned surveyor
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '404':
        description: JobCertificate not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

/api/v1/checklists/job-certificates/{jobCertificateId}/signed-checklist-files:
  put:
    tags:
      - Checklists
    summary: Update signed checklist scan files (keys only)
    description: |
      Updates **only** the `signed_checklist_files` array for this certificate's survey.

      Use this when your UI flow is split into two screens:
      1) Save checklist answers (`PUT /checklists/job-certificates/{jobCertificateId}`)
      2) Upload signed checklist scan(s) and attach them here

      The array is treated as a **full replace**:
      - To replace files: send the new full array
      - To remove all: send `[]`

      Each entry must be an S3 key obtained from
      `GET /checklists/job-certificates/{jobCertificateId}/signed-checklist-upload-url`.
    operationId: updateSignedChecklistFiles
    security:
      - bearerAuth: []
    x-roles: [SURVEYOR]
    parameters:
      - in: path
        name: jobCertificateId
        schema:
          type: string
          format: uuid
        required: true
        description: Unique identifier of the JobCertificate
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [signed_checklist_files]
            properties:
              signed_checklist_files:
                type: array
                items: { type: string }
          example:
            signed_checklist_files:
              - "surveys/signed-checklists/<jobCertificateId>/1714000000000_signed.pdf"
    responses:
      '200':
        description: Updated signed checklist files
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                data:
                  type: object
                  properties:
                    signed_checklist_files:
                      type: array
                      description: Resolved (signed) HTTPS URLs
                      items: { type: string, format: uri }
      '400':
        description: Bad Request (invalid state, terminal job, etc.)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: Forbidden — caller is not the assigned surveyor
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '404':
        description: JobCertificate not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

/api/v1/checklists/jobs/{jobId}/items/{itemId}/review:
  put:
    tags:
      - Checklists
    summary: Review a specific checklist question answer (TO/ADMIN)
    description: |
      Allows a Technical Officer (TO) or ADMIN to approve or reject a specific
      checklist question answer for a job.
      **Roles:** TO, ADMIN
    operationId: reviewChecklistItem
    security:
      - bearerAuth: []
    x-roles: [TO, ADMIN]
    parameters:
      - in: path
        name: jobId
        schema:
          type: string
          format: uuid
        required: true
        description: Unique identifier of the job
      - in: path
        name: itemId
        schema:
          type: string
          format: uuid
        required: true
        description: Unique identifier of the checklist item/answer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status:
                type: string
                enum: [APPROVED, REJECTED]
                description: Status of the checklist item review
              rejection_reason:
                type: string
                description: Reason for rejection (required if status is REJECTED)
              job_certificate_id:
                type: string
                format: uuid
                description: Optional job certificate ID to scope the review
            example:
              status: "REJECTED"
              rejection_reason: "Evidence photo is blurry"
    responses:
      '200':
        description: Checklist item reviewed successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                message: { type: string, example: "Item rejected successfully" }
      '400':
        description: Bad Request (validation error)
      '403':
        description: Forbidden

/api/v1/checklists/jobs/{jobId}/signed-files/{fileIndex}/review:
  put:
    tags:
      - Checklists
    summary: Review a signed document scan (TO/ADMIN)
    description: |
      Allows a Technical Officer (TO) or ADMIN to approve or reject a specific
      uploaded signed checklist document scan (by its index in the array).
      **Roles:** TO, ADMIN
    operationId: reviewSignedDocument
    security:
      - bearerAuth: []
    x-roles: [TO, ADMIN]
    parameters:
      - in: path
        name: jobId
        schema:
          type: string
          format: uuid
        required: true
        description: Unique identifier of the job
      - in: path
        name: fileIndex
        schema:
          type: integer
        required: true
        description: The 0-based index of the signed file to review in the files array
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status:
                type: string
                enum: [APPROVED, REJECTED]
                description: Status of the signed document review
              rejection_reason:
                type: string
                description: Reason for rejection (required if status is REJECTED)
              job_certificate_id:
                type: string
                format: uuid
                description: Optional job certificate ID
            example:
              status: "APPROVED"
    responses:
      '200':
        description: Signed document reviewed successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                message: { type: string, example: "Signed document approved successfully" }
      '400':
        description: Bad Request (validation error)
      '403':
        description: Forbidden
