# ─────────────────────────────────────────────────────────────────────────────
# SURVEYS
#
# The survey lifecycle is certificate-scoped for start/proof/submit, and
# job-scoped for management actions (finalize, rework, statement, timeline).
#
# Certificate-level (SURVEYOR workflow):
#   POST /surveys/start                              — start survey for a cert
#   POST /surveys/{jobCertificateId}/proof           — upload proof for a cert
#   POST /surveys/{jobCertificateId}/submit          — final submit for a cert
#
# Job-level (management):
#   PUT  /surveys/jobs/{jobId}/finalize              — TM finalizes all submitted surveys
#   PUT  /surveys/jobs/{jobId}/rework                — request rework for a cert
#   POST /surveys/jobs/{jobId}/statement/draft       — draft statement
#   POST /surveys/jobs/{jobId}/statement/issue       — issue signed statement
#   GET  /surveys/jobs/{jobId}/timeline              — execution timeline
#   GET  /surveys/jobs/{jobId}                       — survey details (array per cert)
#   GET  /surveys                                    — list all surveys
#
# Role summary:
#   SURVEYOR — start, proof, submit, statement draft, location, sync, violation
#   TM       — finalize, issue statement, draft statement, violation
#   GM/ADMIN — rework, list, timeline
#   TO       — list, timeline
#   CLIENT   — read survey details for own jobs
# ─────────────────────────────────────────────────────────────────────────────

/api/v1/surveys/start:
  post:
    tags: [Surveys]
    summary: Start survey / Check-in (per certificate)
    description: |
      Surveyor checks in at the vessel location for a **specific certificate**.
      A separate check-in is required for each `JobCertificate` in the job.

      - Sets that certificate's survey status to `STARTED`.
      - Records a GPS entry scoped to this certificate's survey.
      - When the **first** certificate survey is started, the parent Job status moves to `IN_PROGRESS`.
    operationId: startSurvey
    security:
      - bearerAuth: []
    x-roles: [SURVEYOR]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [latitude, longitude]
            properties:
              job_id:
                type: string
                format: uuid
                description: Parent Job ID (provide either this OR job_certificate_id)
              job_certificate_id:
                type: string
                format: uuid
                description: The specific certificate to start survey for (preferred)
              latitude: { type: number, example: 19.0760 }
              longitude: { type: number, example: 72.8777 }
          example:
            job_certificate_id: "019e640c-0000-0000-0000-000000000001"
            latitude: 19.0760
            longitude: 72.8777
    responses:
      "201":
        description: Survey started for this certificate
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                message: { type: string, example: "Survey Started" }
                data:
                  type: object
                  properties:
                    survey_id: { type: string, format: uuid }
                    job_certificate_id: { type: string, format: uuid }
                    job_id: { type: string, format: uuid }
                    started_at: { type: string, format: date-time }
      "400": { description: Survey already started or invalid state }
      "403": { description: Forbidden — not the assigned surveyor }

/api/v1/surveys/{jobCertificateId}/proof:
  post:
    tags: [Surveys]
    summary: Upload survey evidence proof (per certificate)
    description: |
      Upload supplemental photos or documents for a specific certificate's survey.
      Moves that certificate's survey to `PROOF_UPLOADED`.

      Accepts either:
      - `multipart/form-data` with a `proof` binary field
      - `application/json` with a `fileKey` (S3 key, pre-uploaded via presigned URL)
    operationId: uploadProof
    security:
      - bearerAuth: []
    x-roles: [SURVEYOR]
    parameters:
      - in: path
        name: jobCertificateId
        required: true
        schema: { type: string, format: uuid }
        description: Job Certificate ID
    requestBody:
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              proof: { type: string, format: binary }
              job_certificate_id: { type: string, format: uuid }
        application/json:
          schema:
            type: object
            properties:
              fileKey: { type: string, description: "S3 key for evidence proof" }
              job_certificate_id: { type: string, format: uuid }
          example:
            fileKey: "surveys/proof/019e640c-0000-0000-0000-000000000001/photo.jpg"
    responses:
      "201": { description: Proof uploaded }
      "400": { description: Invalid state or missing proof }
      "403": { description: Forbidden — not the assigned surveyor }

/api/v1/surveys/{jobCertificateId}/submit:
  post:
    tags: [Surveys]
    summary: Submit survey report / Check-out (per certificate)
    description: |
      Surveyor submits final findings for a **specific certificate**. Each
      `JobCertificate` has its own independent survey that must be submitted
      separately.

      - Sets this certificate's survey to `SUBMITTED`.
      - When **all** certificates' surveys are `SUBMITTED`, the parent Job status
        automatically advances to `SURVEY_DONE`.

      **Note:** `photoKey` and `signatureKey` must be pre-uploaded S3 keys.
    operationId: submitSurveyReport
    security:
      - bearerAuth: []
    x-roles: [SURVEYOR]
    parameters:
      - in: path
        name: jobCertificateId
        required: true
        schema: { type: string, format: uuid }
        description: Job Certificate ID
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              submit_latitude: { type: number, description: "GPS latitude at submission" }
              submit_longitude: { type: number, description: "GPS longitude at submission" }
              survey_statement: { type: string, description: "Final findings statement" }
              photo: { type: string, format: binary, description: "Attendance photo" }
              signature: { type: string, format: binary, description: "Surveyor digital signature" }
              photoKey: { type: string, description: "S3 key for attendance photo (if pre-uploaded)" }
              signatureKey: { type: string, description: "S3 key for signature (if pre-uploaded)" }
        application/json:
          schema:
            type: object
            properties:
              submit_latitude: { type: number }
              submit_longitude: { type: number }
              survey_statement: { type: string }
              photoKey: { type: string, description: "S3 key for attendance photo" }
              signatureKey: { type: string, description: "S3 key for surveyor signature" }
          example:
            submit_latitude: 19.0760
            submit_longitude: 72.8777
            survey_statement: "Vessel hull in satisfactory condition. Anti-fouling paint intact."
            photoKey: "surveys/photos/019e640c.jpg"
            signatureKey: "surveys/signatures/019e640c.png"
    responses:
      "201":
        description: Survey submitted for this certificate
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                data: { $ref: '#/components/schemas/SurveyReportResponse' }
      "400": { description: Checklist/proof incomplete or invalid state }
      "403": { description: Forbidden }

/api/v1/surveys:
  get:
    tags: [Surveys]
    summary: List survey reports
    operationId: getSurveyReports
    security:
      - bearerAuth: []
    x-roles: [ADMIN, GM, TM, TO]
    parameters:
      - name: page
        in: query
        schema: { type: integer, default: 1 }
      - name: limit
        in: query
        schema: { type: integer, default: 10 }
      - name: survey_status
        in: query
        schema:
          type: string
          enum: [NOT_STARTED, STARTED, CHECKLIST_SUBMITTED, PROOF_UPLOADED, SUBMITTED, REWORK_REQUIRED, FINALIZED]
      - name: surveyor_id
        in: query
        schema: { type: string, format: uuid }
    responses:
      "200":
        description: List of survey reports
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                data:
                  type: object
                  properties:
                    total: { type: integer, example: 50 }
                    page: { type: integer, example: 1 }
                    limit: { type: integer, example: 10 }
                    totalPages: { type: integer, example: 5 }
                    rows:
                      type: array
                      items: { $ref: '#/components/schemas/SurveyListResponse' }

/api/v1/surveys/jobs/{jobId}:
  get:
    tags: [Surveys]
    summary: Get survey details for a job (all certificates)
    description: |
      Returns an **array** of survey objects — one per `JobCertificate` — for
      the given job. Use this to see status, checklist progress, and statement
      details across all certificates.
    operationId: getSurveyDetails
    security:
      - bearerAuth: []
    x-roles: [ADMIN, GM, TM, TO, SURVEYOR, CLIENT]
    parameters:
      - name: jobId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Job ID
    responses:
      "200":
        description: Survey details array (one per certificate)
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                data:
                  type: array
                  items: { $ref: '#/components/schemas/SurveyReportResponse' }
      "404": { description: Job not found }

/api/v1/surveys/jobs/{jobId}/finalize:
  put:
    tags: [Surveys]
    summary: Finalize all submitted surveys for a job (TM)
    description: |
      Allows a Technical Manager (TM) to grant final approval to **all** submitted
      surveys for this job in one call.

      **Workflow Logic:**
      - Transitions all `SUBMITTED` certificate surveys to `FINALIZED`.
      - `JobCertificate` status remains at `SURVEY_DONE` after finalization.
        The GM must then explicitly generate + issue physical certificates
        (`POST /certificates` + `POST /certificates/{id}/issue`) to advance to `ISSUED`.
      - Parent Job advances to `FINALIZED` when all certs are done.

      **Roles:** TM, ADMIN
    operationId: finalizeSurvey
    security:
      - bearerAuth: []
    x-roles: [TM, ADMIN]
    parameters:
      - name: jobId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Job ID
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              remarks:
                type: string
                description: Optional finalization remarks
    responses:
      "200":
        description: Survey(s) finalized successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                message: { type: string, example: "All surveys finalized." }
      "400":
        description: No submitted surveys found to finalize
      "403":
        description: Forbidden — not a TM or ADMIN

/api/v1/surveys/jobs/{jobId}/rework:
  put:
    tags: [Surveys]
    summary: Request rework on submitted survey (ADMIN/GM/TM)
    description: |
      Allows ADMIN, GM, or TM to request corrections on a submitted survey.

      - Sets the target certificate's survey status to `REWORK_REQUIRED`.
      - The surveyor must re-complete checklist, re-upload proof, and re-submit.

      **Roles:** ADMIN, GM, TM
    operationId: requestRework
    security:
      - bearerAuth: []
    x-roles: [ADMIN, GM, TM]
    parameters:
      - name: jobId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Job ID
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [reason]
            properties:
              reason:
                type: string
                description: Reason/feedback for requesting rework
                example: "Incomplete proof for engine section."
              job_certificate_id:
                type: string
                format: uuid
                description: Target a specific certificate (if job has multiple)
    responses:
      "200":
        description: Rework requested successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                message: { type: string, example: "Rework requested successfully" }
      "400": { description: Job is not in a reworkable state }
      "403": { description: Forbidden }

/api/v1/surveys/jobs/{jobId}/violation:
  post:
    tags: [Surveys]
    summary: Flag a survey violation
    operationId: flagViolation
    security:
      - bearerAuth: []
    x-roles: [SURVEYOR, TM, ADMIN]
    parameters:
      - name: jobId
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [violation_type, description]
            properties:
              violation_type: { type: string, example: "SAFETY_BREACH" }
              description: { type: string, example: "Fire suppression system not operational." }
    responses:
      "200": { description: Violation flagged }

/api/v1/surveys/jobs/{jobId}/statement/draft:
  post:
    tags: [Surveys]
    summary: Draft survey statement / Generate preview
    description: |
      Saves the survey statement text and/or triggers report generation.
      - **SURVEYOR**: Must provide `survey_statement` text and `job_certificate_id`.
      - **TM/ADMIN**: Can omit text to trigger/refresh the branded "DRAFT" PDF.
    operationId: draftSurveyStatement
    security:
      - bearerAuth: []
    x-roles: [SURVEYOR, TM, ADMIN]
    parameters:
      - name: jobId
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              survey_statement: { type: string }
              job_certificate_id:
                type: string
                format: uuid
                description: Target a specific certificate (required for SURVEYOR)
    responses:
      "200":
        description: Statement drafted
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                data:
                  type: object
                  properties:
                    message: { type: string }
                    status: { type: string, example: "DRAFTED" }
                    pdf_url: { type: string, format: uri, description: "Branded draft PDF URL (TM/ADMIN only)" }

/api/v1/surveys/jobs/{jobId}/statement/issue:
  post:
    tags: [Surveys]
    summary: Issue signed survey statement (PDF)
    description: |
      Finalizes the survey statement as official for a specific certificate.
      Removes the "DRAFT" watermark and marks the statement as issued.

      Accepts either:
      - `multipart/form-data` with a `statement` binary PDF file
      - `application/json` with a `statementFileKey` (S3 key, pre-uploaded)

      **Note:** Can be called after job is `CERTIFIED` or `FINALIZED` since
      statement issuance is a post-finalization action.
    operationId: issueSurveyStatement
    security:
      - bearerAuth: []
    x-roles: [TM, ADMIN]
    parameters:
      - name: jobId
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              statement: { type: string, format: binary }
              job_certificate_id: { type: string, format: uuid }
        application/json:
          schema:
            type: object
            properties:
              statementFileKey:
                type: string
                description: S3 key for pre-uploaded signed PDF
                example: "surveys/statements/019e640c.pdf"
              job_certificate_id:
                type: string
                format: uuid
                description: The certificate to issue the statement for
          example:
            statementFileKey: "surveys/statements/019e640c.pdf"
            job_certificate_id: "019e640c-0000-0000-0000-000000000001"
    responses:
      "200":
        description: Statement issued successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                message: { type: string, example: "Statement issued" }
      "400": { description: No statement file provided }
      "403": { description: Forbidden }

/api/v1/surveys/jobs/{jobId}/timeline:
  get:
    tags: [Surveys]
    summary: Get survey execution timeline (all certificates)
    description: |
      Returns GPS trace and status history for all certificate surveys of this job.
      GPS points are scoped per `JobCertificate`.
    operationId: getSurveyTimeline
    security:
      - bearerAuth: []
    x-roles: [ADMIN, GM, TM, TO, SURVEYOR]
    parameters:
      - name: jobId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      "200":
        description: Survey timeline
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                data: { $ref: '#/components/schemas/SurveyTimelineResponse' }

/api/v1/surveys/jobs/{jobId}/location:
  post:
    tags: [Surveys]
    summary: Stream live GPS location during survey
    description: |
      Real-time GPS tracking during survey execution.
      GPS points are scoped to the specific `JobCertificate` survey.
    operationId: streamLocation
    security:
      - bearerAuth: []
    x-roles: [SURVEYOR]
    parameters:
      - name: jobId
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      content:
        application/json:
          schema:
            type: object
            required: [latitude, longitude]
            properties:
              latitude: { type: number }
              longitude: { type: number }
              job_certificate_id: { type: string, format: uuid, description: "Certificate being surveyed" }
    responses:
      "200": { description: Location updated }

/api/v1/surveys/jobs/{jobId}/sync:
  post:
    tags: [Surveys]
    summary: Offline sync — replay batched data
    description: |
      Replays checklist answers and GPS points captured while offline.
      Include `job_certificate_id` to scope data to the correct certificate survey.
    operationId: syncOfflineData
    security:
      - bearerAuth: []
    x-roles: [SURVEYOR]
    parameters:
      - name: jobId
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              job_certificate_id: { type: string, format: uuid, description: "The certificate being surveyed offline" }
              checklist:
                type: array
                items:
                  type: object
                  required: [question_code, question_text, answer]
                  properties:
                    question_code: { type: string, example: "Q1" }
                    question_text: { type: string }
                    answer: { type: string, enum: [YES, NO, NA] }
                    remarks: { type: string }
              gps_points:
                type: array
                items:
                  type: object
                  required: [latitude, longitude]
                  properties:
                    latitude: { type: number }
                    longitude: { type: number }
                    captured_at: { type: string, format: date-time }
    responses:
      "200":
        description: Offline data synced
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                message: { type: string }
                synced:
                  type: object
                  properties:
                    checklist_items: { type: integer }
                    gps_points: { type: integer }
      "400": { description: Invalid job state or surveyor mismatch }
      "403": { description: Forbidden }
      "404": { description: Job not found }
