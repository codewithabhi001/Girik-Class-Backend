/api/v1/system/metrics:
  get:
    tags: [System]
    summary: Get system metrics
    operationId: getSystemMetrics
    x-roles: [ADMIN]
    responses:
      "200": { description: System metrics }
      "403": { description: Forbidden }

/api/v1/system/health:
  get:
    tags: [System]
    summary: Get system health
    operationId: getSystemHealth
    x-roles: [ADMIN, GM, TM, TO, SURVEYOR, CLIENT]
    responses:
      "200": { description: Health status }

/api/v1/system/readiness:
  get:
    tags: [System]
    summary: Get system readiness
    operationId: getSystemReadiness
    x-roles: [ADMIN, GM, TM, TO, SURVEYOR, CLIENT]
    responses:
      "200": { description: Readiness status }

/api/v1/system/version:
  get:
    tags: [System]
    summary: Get system version
    operationId: getSystemVersion
    x-roles: [ADMIN, GM, TM, TO, SURVEYOR, CLIENT]
    responses:
      "200": { description: Version info }

/api/v1/system/audit-logs:
  get:
    tags: [System]
    summary: Get audit logs
    operationId: getAuditLogs
    x-roles: [ADMIN]
    responses:
      "200": { description: Audit logs }
      "403": { description: Forbidden }

/api/v1/system/users/{id}/logout:
  post:
    tags: [System]
    summary: Force user logout
    operationId: forceLogout
    x-roles: [ADMIN]
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      "200": { description: User logged out }
      "403": { description: Forbidden }

/api/v1/system/migrations:
  get:
    tags: [System]
    summary: Get migrations
    operationId: getMigrations
    x-roles: [ADMIN]
    responses:
      "200": { description: Migration status }
      "403": { description: Forbidden }

/api/v1/system/jobs/failed:
  get:
    tags: [System]
    summary: Get failed jobs
    operationId: getFailedJobs
    x-roles: [ADMIN]
    responses:
      "200": { description: Failed jobs }
      "403": { description: Forbidden }

/api/v1/system/jobs/{id}/retry:
  post:
    tags: [System]
    summary: Retry failed job
    operationId: retryJob
    x-roles: [ADMIN]
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    responses:
      "200": { description: Job retried }
      "403": { description: Forbidden }

/api/v1/system/maintenance/{action}:
  post:
    tags: [System]
    summary: Maintenance action
    operationId: maintenanceAction
    x-roles: [ADMIN]
    parameters:
      - name: action
        in: path
        required: true
        schema: { type: string }
    responses:
      "200": { description: Action executed }
      "403": { description: Forbidden }

/api/v1/system/feature-flags:
  get:
    tags: [System]
    summary: Get feature flags
    operationId: getFeatureFlags
    x-roles: [ADMIN]
    responses:
      "200": { description: Feature flags }
      "403": { description: Forbidden }

/api/v1/system/locales:
  get:
    tags: [System]
    summary: Get locales
    operationId: getLocales
    x-roles: [ADMIN]
    responses:
      "200": { description: Locales }
      "403": { description: Forbidden }

/api/v1/system/maintenance:
  get:
    tags: [System]
    summary: Get global maintenance mode status
    operationId: getMaintenanceMode
    x-roles: [PUBLIC, ADMIN, GM, TM, TO, SURVEYOR, CLIENT]
    responses:
      "200":
        description: Current maintenance state
  post:
    tags: [System]
    summary: Update global maintenance mode status (Admin only)
    operationId: updateMaintenanceMode
    x-roles: [ADMIN]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [isMaintenance]
            properties:
              isMaintenance: { type: boolean }
              message: { type: string }
    responses:
      "200":
        description: Maintenance state updated successfully
      "403":
        description: Forbidden

/api/v1/system/app-status:
  get:
    tags: [System]
    summary: Check mobile app version support and maintenance status
    operationId: getAppStatus
    x-roles: [PUBLIC, ADMIN, GM, TM, TO, SURVEYOR, CLIENT]
    parameters:
      - name: platform
        in: query
        required: true
        schema: { type: string, enum: [ios, android] }
      - name: version
        in: query
        required: true
        schema: { type: integer }
    responses:
      "200":
        description: Mobile app status and update requirement details
      "400":
        description: Bad request / unsupported platform or version
