/api/v1/notifications:
  get:
    tags: [Notifications]
    summary: Get notifications
    operationId: getNotifications
    x-roles: [ADMIN, GM, TM, TO, SURVEYOR, CLIENT]
    responses:
      "200":
        description: List of notifications retrieved successfully
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  title: { type: string, example: "Job Assigned" }
                  message: { type: string, example: "You have been assigned to survey Sea Star." }
                  type: { type: string, example: "JOB_ASSIGNED" }
                  is_read: { type: boolean, example: false }
                  created_at: { type: string, format: date-time }

/api/v1/notifications/{id}/read:
  put:
    tags: [Notifications]
    summary: Mark as read
    operationId: markNotificationRead
    x-roles: [ADMIN, GM, TM, TO, SURVEYOR, CLIENT]
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      "200": { description: Marked as read }

/api/v1/notifications/read-all:
  put:
    tags: [Notifications]
    summary: Mark all as read
    operationId: markAllNotificationsRead
    x-roles: [ADMIN, GM, TM, TO, SURVEYOR, CLIENT]
    responses:
      "200": { description: All marked as read }

/api/v1/notifications/preferences:
  get:
    tags: [Notifications]
    summary: Get notification preferences
    operationId: getNotificationPreferences
    security:
      - bearerAuth: []
    x-roles: [ADMIN, GM, TM, TO, SURVEYOR, CLIENT]
    responses:
      "200":
        description: Notification preferences retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                data:
                  $ref: '#/components/schemas/NotificationPreference'

  put:
    tags: [Notifications]
    summary: Update notification preferences
    operationId: updateNotificationPreferences
    security:
      - bearerAuth: []
    x-roles: [ADMIN, GM, TM, TO, SURVEYOR, CLIENT]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotificationPreferenceRequest'
    responses:
      "200":
        description: Notification preferences updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                data:
                  $ref: '#/components/schemas/NotificationPreference'
